artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: http://images.cocodataset.org/annotations/annotations_trainval2014.zip
  local_data_file: artifacts/data_ingestion/annotations.zip
  unzip_dir: artifacts/data_ingestion

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion
  vocab_file: artifacts/data_transformation/vocab.pkl

model_trainer:
  root_dir: artifacts/model_trainer
  data_path: artifacts/data_ingestion
  vocab_file: artifacts/data_transformation/vocab.pkl
  trained_model_path: artifacts/model_trainer/model.pth

model_evaluation:
  root_dir: artifacts/model_evaluation
  data_path: artifacts/data_ingestion
  model_path: artifacts/model_trainer/model.pth
  vocab_file: artifacts/data_transformation/vocab.pkl
  metrics_file: artifacts/model_evaluation/metrics.json