[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-captioner"
version = "0.1.0"
description = "Production-ready image captioning with reproducible MLOps workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "pillow>=10.0", "pycocotools>=2.0.7",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9",
  "pydantic-settings>=2.2", "typer>=0.12", "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27", "pre-commit>=3.7"]
mlops = ["mlflow>=2.12", "dvc[s3]>=3.50", "prometheus-client>=0.20"]

[project.scripts]
captioner = "captioner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
